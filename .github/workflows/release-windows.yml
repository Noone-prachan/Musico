name: Build and publish Musico for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out Musico
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Build installer and release bundle
        shell: pwsh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_API_KEY)) {
            throw 'Add a restricted YOUTUBE_API_KEY repository secret before publishing a release.'
          }
          .\installer\build_musico_release.ps1 -OutputDirectory "$env:RUNNER_TEMP\Musico-Release"

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'Musico-Release'
          gh release create "${{ github.ref_name }}" `
            (Join-Path $releaseDirectory 'Musico-Setup.exe') `
            (Join-Path $releaseDirectory 'Musico-Windows-x64.zip') `
            (Join-Path $releaseDirectory 'Musico-Windows-x64.zip.sha256') `
            --title "Musico ${{ github.ref_name }}" `
            --generate-notes
